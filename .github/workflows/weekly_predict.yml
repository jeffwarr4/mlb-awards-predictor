# .github/workflows/weekly_predict.yml
# ---------------------------------------------------------------
# Runs every Monday at 9 AM ET (13:00 UTC) during MLB season.
# Also supports manual runs via workflow_dispatch.
#
# What it does:
#   1. Sets up Python + dependencies
#   2. Checks out stinger-assets (headshots + logos for graphics)
#   3. Downloads free font alternatives (Oswald / Barlow) for rendering
#   4. Pulls FanGraphs actuals (WAR, wRC+, FIP) — one request per stat type
#   5. Runs src/predict_awards.py  → predictions/, graphics/, captions
#   6. Commits updated predictions AND refreshed fg_exports back to the repo
#   7. Uploads CSVs + PNGs as workflow artifacts
#   8. Fails the run if the FanGraphs pull failed, so it can't go unnoticed
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY  — enables chip/why and social caption generation
#   STINGER_ASSETS_PAT — personal access token with read access to
#                        jeffwarr4/stinger-assets (only needed if that
#                        repo is private; omit for public repos)
# ---------------------------------------------------------------

name: Weekly MLB Awards Prediction

on:
  schedule:
    # Every Monday at 9:00 AM ET (13:00 UTC)
    - cron: '0 13 * * 1'

  # Manual trigger — run anytime from Actions tab
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year (default: current)'
        required: false
        default: '2026'

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout main repo ─────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Checkout stinger-assets (headshots + logos) ────────
      # Checked out as a sibling directory so STINGER_ASSETS_DIR
      # matches the ../stinger-assets/ convention used locally.
      # If stinger-assets is private, add a PAT as STINGER_ASSETS_PAT
      # in repo Settings → Secrets → Actions and uncomment the token line.
      - name: Checkout stinger-assets
        uses: actions/checkout@v4
        with:
          repository: jeffwarr4/stinger-assets
          path: stinger-assets
          # token: ${{ secrets.STINGER_ASSETS_PAT }}

      # ── 3. Set up Python ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 4. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Verify fonts are present (committed to repo in assets/fonts/) ─
      - name: Verify rendering fonts
        run: |
          echo "Font files in assets/fonts/:"
          find assets/fonts -name "*.ttf" | sort
          python - <<'EOF'
          from pathlib import Path
          needed = [
            "assets/fonts/Oswald/static/Oswald-Bold.ttf",
            "assets/fonts/Barlow_Condensed/BarlowCondensed-Medium.ttf",
            "assets/fonts/Barlow_Condensed/BarlowCondensed-SemiBold.ttf",
            "assets/fonts/Barlow_Semi_Condensed/BarlowSemiCondensed-SemiBold.ttf",
          ]
          missing = [p for p in needed if not Path(p).exists()]
          if missing:
            print("MISSING fonts:", missing)
          else:
            print("All 4 fonts present ✓")
          EOF

      # ── 6. Pull FanGraphs current stats ──────────────────────
      # One request per stat type against the public leaderboard API.
      #
      # This used to be expected to fail on CI ("Cloudflare blocks runner
      # IPs") and the committed fg_exports CSVs were the real data source,
      # refreshed by hand from a local machine. That diagnosis was wrong:
      # the 403s came from this repo's own spoofed Chrome User-Agent, not
      # from the runner's IP. With no custom headers the endpoint returns
      # 200. See src/pull_fg_current.py --probe.
      #
      # continue-on-error so a genuine outage still produces predictions
      # from the committed CSVs; the Report step below fails the run
      # afterwards so the failure is visible rather than silently swallowed.
      - name: Pull FanGraphs actuals
        id: fgpull
        continue-on-error: true
        run: python src/pull_fg_current.py --force
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Report FanGraphs pull outcome
        run: |
          if [ "${{ steps.fgpull.outcome }}" = "success" ]; then
            echo "FG pull OK — fg_exports refreshed on the runner."
          else
            echo "::warning::FanGraphs pull failed — falling back to the committed fg_exports CSVs."
            echo "Run 'python src/pull_fg_current.py --probe' to diagnose."
          fi

      # ── 8. Run prediction script ──────────────────────────────
      - name: Run weekly prediction
        run: python src/predict_awards.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets
          # FanGraphs credentials — used by get_fg_actuals() when the
          # team-by-team scrape is blocked by Cloudflare (common on CI).
          # Add FG_USERNAME and FG_APP_PASSWORD in repo Settings → Secrets → Actions.
          FG_USERNAME:     ${{ secrets.FG_USERNAME }}
          FG_APP_PASSWORD: ${{ secrets.FG_APP_PASSWORD }}

      # ── 8. Upload predictions as artifacts ────────────────────
      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-predictions-${{ github.run_number }}
          path: |
            predictions/**/*.csv
            predictions/**/*.png
            predictions/**/*.txt
          retention-days: 90
          if-no-files-found: warn

      # ── 9. Commit updated predictions back to repo ────────────
      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add predictions/
          git add -f predictions/**/.prev_top10_*.csv 2>/dev/null || true

          # Also commit the refreshed FanGraphs exports when the pull worked.
          # Keeps the committed fallback warm for any run where FanGraphs is
          # genuinely down, and removes the need to upload them by hand.
          if [ "${{ steps.fgpull.outcome }}" = "success" ]; then
            git add data/raw/fg_exports/fg_bat_*.csv data/raw/fg_exports/fg_pit_*.csv
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: weekly predictions update ${TIMESTAMP} [skip ci]"
            git push
          fi

      # ── 10. Surface a failed FanGraphs pull ───────────────────
      # Runs last so predictions are still produced and committed above.
      - name: Fail run if FanGraphs pull failed
        if: steps.fgpull.outcome == 'failure'
        run: |
          echo "FanGraphs pull failed — predictions were generated from stale committed CSVs."
          exit 1
